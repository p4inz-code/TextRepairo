[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textrepairo"
dynamic = ["version"]
description = "Offline, open-source tool that turns messy text in any language into proper English (fix, formal, friendly, prompt style). Runs a local LLM, no internet needed after setup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TextRepairo contributors" }]
keywords = ["grammar", "llm", "offline", "llama.cpp", "writing", "translation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6.5", "pillow>=10"]

[project.scripts]
textrepairo = "textrepairo.cli:main"

[project.gui-scripts]
textrepairo-gui = "textrepairo.cli:gui_main"

[project.urls]
Homepage = "https://github.com/p4inz-code/TextRepairo"
Issues = "https://github.com/p4inz-code/TextRepairo/issues"

[tool.setuptools.dynamic]
version = { attr = "textrepairo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
textrepairo = ["web/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
